name: Build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/go.mod

      - name: Install libnotmuch runtime deps
        run: sudo apt-get update && sudo apt-get install -y libxapian-dev libtalloc-dev libgmime-3.0-dev libz-dev
      - name: Cache libnotmuch
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/notmuch-install
          key: notmuch-0.40-${{ runner.os }}-${{ runner.image }}

      - name: Install libnotmuch
        run: .github/install-libnotmuch.sh

      - name: Format
        run: make format

      - name: Vet
        working-directory: src
        run: go vet ./...

      - name: Build
        working-directory: src
        run: go build ./...

      - name: Build (lua)
        working-directory: src
        run: go build -tags lua ./...

      - name: Test
        run: make test TAGS=""

      - name: Test (race)
        run: make test-race TAGS=""

      - name: Test (lua)
        run: make test

      - name: Test (lua mcp)
        run: make test TAGS="lua mcp"
