name: Fuzz

on:
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "13 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzRenderHTML
            pkg: ./mail/
          - target: FuzzCSSDeclarations
            pkg: ./lib/html/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod

      - name: Cache libnotmuch
        uses: actions/cache@v6
        with:
          path: ~/notmuch-install
          key: notmuch-0.40-${{ runner.os }}

      - name: Install libnotmuch
        run: .github/install-libnotmuch.sh

      - name: Fuzz ${{ matrix.target }}
        working-directory: src
        run: go test -fuzz=${{ matrix.target }} -fuzztime=120s ${{ matrix.pkg }}
