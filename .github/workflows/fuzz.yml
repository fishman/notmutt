name: Fuzz

on:
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "13 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzRenderHTML
            pkg: ./mail/
          - target: FuzzCSSDeclarations
            pkg: ./lib/html/
          - target: FuzzLoadCommand
            pkg: ./app/aicmd/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/go.mod

      - name: Install libnotmuch runtime deps
        run: sudo apt-get update && sudo apt-get install -y libxapian-dev libtalloc-dev libgmime-3.0-dev libz-dev
      - name: Cache libnotmuch
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/notmuch-install
          key: notmuch-0.40-${{ runner.os }}-${{ runner.image }}

      - name: Install libnotmuch
        run: .github/install-libnotmuch.sh

      - name: Fuzz ${{ matrix.target }}
        working-directory: src
        run: go test -fuzz=${{ matrix.target }} -fuzztime=120s ${{ matrix.pkg }}
