# Build deb/rpm (nfpm) + Arch (makepkg) packages from a vMAJOR.MINOR.PATCH tag.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deb-rpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/go.mod

      - name: Install libnotmuch runtime deps
        run: sudo apt-get update && sudo apt-get install -y libxapian-dev libtalloc-dev libgmime-3.0-dev libz-dev

      - name: Cache libnotmuch (static)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/notmuch-static
          key: notmuch-0.40-static-${{ runner.os }}-${{ runner.image }}

      - name: Install libnotmuch (static)
        run: .github/install-libnotmuch.sh --static

      - name: Derive and validate version
        id: ver
        env:
          REF: ${{ github.ref_name }}
        run: |
          v="${REF#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
            { echo "tag $REF is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build binary (cgo, GPL)
        run: make build

      - name: Build binary (cli, Apache-clean)
        run: make build-cli

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Package deb (cgo, GPL)
        run: |
          mkdir -p dist
          nfpm package --packager deb --config packaging/notmutt.yaml \
            --target dist/notmutt_${VERSION}_amd64.deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Package rpm (cgo, GPL)
        run: |
          nfpm package --packager rpm --config packaging/notmutt.yaml \
            --target dist/notmutt-${VERSION}-1.x86_64.rpm
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Package deb (cli, Apache-clean)
        run: |
          nfpm package --packager deb --config packaging/notmutt-cli.yaml \
            --target dist/notmutt-cli_${VERSION}_amd64.deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Package rpm (cli, Apache-clean)
        run: |
          nfpm package --packager rpm --config packaging/notmutt-cli.yaml \
            --target dist/notmutt-cli-${VERSION}-1.x86_64.rpm
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-rpm
          path: dist/

  arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive and validate version
        id: ver
        env:
          REF: ${{ github.ref_name }}
        run: |
          v="${REF#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
            { echo "tag $REF is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build Arch package (cgo, GPL)
        working-directory: packaging/notmutt
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/pkg" -e VERSION="$VERSION" \
            archlinux/archlinux:base-devel bash -c '
            pacman -Syu --noconfirm >/dev/null
            pacman -S --noconfirm --needed git go notmuch >/dev/null
            cd /pkg
            useradd -m builder
            sed "s/@PKGVER@/$VERSION/" PKGBUILD > PKGBUILD.ci
            mv PKGBUILD.ci PKGBUILD
            chown -R builder /pkg
            runuser -u builder -- makepkg -f --noconfirm
          '

      - name: Build Arch package (cli, Apache-clean)
        working-directory: packaging/notmutt-cli
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/pkg" -e VERSION="$VERSION" \
            archlinux/archlinux:base-devel bash -c '
            pacman -Syu --noconfirm >/dev/null
            pacman -S --noconfirm --needed git go notmuch >/dev/null
            cd /pkg
            useradd -m builder
            sed "s/@PKGVER@/$VERSION/" PKGBUILD > PKGBUILD.ci
            mv PKGBUILD.ci PKGBUILD
            chown -R builder /pkg
            runuser -u builder -- makepkg -f --noconfirm
          '

      - name: Upload Arch package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch
          path: |
            packaging/notmutt/*.pkg.tar.zst
            packaging/notmutt-cli/*.pkg.tar.zst

  release:
    needs: [deb-rpm, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
