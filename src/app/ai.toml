# AI config: providers, per-account data grants, and the [mcp] agent
# boundary. Deny by default - nothing here serves until you fill it in.
# See docs/usage.md for the full reference.

# [ai.<name>]                     # a provider
# type = "deepseek"               # deepseek | anthropic | openai | ollama
# model = "deepseek-v4-flash"
# pass_cmd = ["pass", "show", "llm/deepseek"]

# [ai-data.<account>]             # fields an account permits toward an LLM
# data = ["participants", "subjects", "dates", "count", "bodies", "last_body", "structure"]
# [ai-data."*"]                   # wildcard account: every account
# data = ["*"]                    # wildcard field: every field

# [mcp]                           # the stdio server's data boundary
# tags = ["inbox"]                # soft tags whose mail is reachable
#                                  # deny-by-default: no account table serves nothing

# [mcp.accounts.gmail]            # folder space AND the account tag; the name
# tags = ["work"]                 #   must match an [accounts.<name>]

# [mcp.accounts.gmail.attachments]  # attachment list metadata (name/mime/size)
# enabled = true

# [mcp.accounts.gmail.bodies]       # cleaned body text (no headers) - the same
# enabled = true                    #   cleaner the [ai-data] "bodies" grants
# max_messages = 10                 # per-account per-thread pull cap (default 10)

# [mcp.accounts.gmail.tagging]      # write soft tags on in-scope mail (no moves)
# enabled = true

# [mcp.accounts.gmail.apply]        # non-destructive folder verbs (archive, ...)
# enabled = true                    #   via the folder-move apply; delete denied
