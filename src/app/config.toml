# user config overlay (R8): merges over the embedded base config and the
# split files in this dir - accounts.toml (`notmutt setup` writes the
# detected folder structure there, [accounts.<name>.folders]),
# filters.toml, ai.toml. Every *.toml here merges, config.toml wins on
# conflicts; nothing here is required. A readonly account is never
# classified and never sends.

# [accounts.gmail]
# from = "You <you@gmail.com>"
# default_signature = "gmail"

# [accounts.example]
# from = "You <you@example.com>"
# readonly = true

[refresh]
interval = 10

[pager]
# default-views = { "linkedin.com" = "html", "substack.com" = "html" }

# The mcp stdio server (notmutt mcp, built with TAGS="lua mcp") serves
# metadata for mail in scope: [mcp] tags names the reachable soft tags,
# each [mcp.accounts.<name>] grants one account's folder space AND its
# account tag. Deny by default - no account table serves nothing. Beyond
# the metadata three (thread_info/search/count), each capability is off
# until the owning account enables it. The deleted-home tag is never
# reachable.
# [mcp]
# tags = ["inbox"]          # a message must carry one of these

# [mcp.accounts.dynamia]    # the name must match an [accounts.<name>]
# tags = ["work"]           # this account's own additions to [mcp] tags

# [mcp.accounts.dynamia.attachments]  # attachment list metadata
# enabled = true

# [mcp.accounts.dynamia.bodies]       # cleaned body text, no headers
# enabled = true
# max_messages = 10         # per-account per-thread pull cap (default 10)

# [mcp.accounts.dynamia.tagging]      # write soft tags (no moves)
# enabled = true

# [mcp.accounts.dynamia.apply]        # folder verbs (archive, ...);
# enabled = true            #   the deleted home is code-denied

