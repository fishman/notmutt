# base config: the builtin defaults as data (R8). The user config file
# overlays this at load; nothing here is compiled into Go. The binding
# schemes mirror the mutt key map (muttrc/base.bindings + base.macros
# are the reference - the mutt-exact keys, client-only actions on keys
# mutt leaves free). A binding entry is a table { fun = "...", desc =
# "..." } (the reference shape - extra keys can grow per binding), an
# array ["action", "description"], or a plain action string; the
# description travels with the binding - the help dialog's one-line
# texts (neomutt/help.c columns) derive from these entries, there is
# no separate descriptions block. Descriptions are user data, ready
# for translation; the vim scheme carries them, the other schemes
# inherit by action. Keyhint visibility is opt-in: every binding is
# hidden from the keyhint row unless its table marks show = true (the
# help dialog lists every binding regardless). The generic navigation
# and paging keys (j/k, arrows, g g/G, enter, page keys) stay
# unmarked.

[tag-actions]
"toggle-read" = "unread"
"archive" = "archive"
"inbox" = "inbox"
"delete" = "deleted"
"spam" = "spam"
"pending" = "pending"

# exclusive folder tag group (R2): one message has exactly one home;
# applying any member removes the other members present (inbox included)
[tag-groups.folder]
tags = ["inbox", "archive", "deleted", "sent", "draft", "pending", "spam"]

# the link opener (the pager F key): argv, the url is appended as the
# last element (F4 - never shell-interpolated)
opener = ["xdg-open"]

[schemes.vim.index]
"j" = { fun = "cursor-down", desc = "Move the cursor down" }
"k" = { fun = "cursor-up", desc = "Move the cursor up" }
"down" = { fun = "cursor-down" }
"up" = { fun = "cursor-up" }
"enter" = { fun = "open", desc = "Open the message under the cursor" }
"h" = { fun = "open-headers", desc = "Open the message with the full headers", show = true }
"q" = { fun = "quit", desc = "Quit notmutt", show = true }
"r" = { fun = "reply", desc = "Reply to the sender", show = true }
