# base config: the builtin defaults as data (R8). The user config file
# overlays this at load; nothing here is compiled into Go. The binding
# schemes mirror the mutt key map (muttrc/base.bindings + base.macros
# are the reference - the mutt-exact keys, client-only actions on keys
# mutt leaves free). Descriptions are the help dialog's one-line texts
# (neomutt/help.c columns); they are user data, ready for translation.

[tag-actions]
"toggle-read" = "unread"
"archive" = "archive"
"delete" = "deleted"
"spam" = "spam"
"pending" = "pending"

[descriptions]
"cursor-down" = "Move the cursor down"
"cursor-up" = "Move the cursor up"
"cursor-top" = "Jump to the first row"
"cursor-bottom" = "Jump to the last row"
"page-down" = "Scroll down one page"
"page-up" = "Scroll up one page"
"half-page-down" = "Scroll down half a page"
"half-page-up" = "Scroll up half a page"
"open" = "Open the message under the cursor"
"preview" = "Preview the message under the cursor"
"quit" = "Quit notmutt"
"undo" = "Discard the staged tag ops on this message"
"apply" = "Apply the staged tag ops"
"reply" = "Reply to the sender"
"reply-all" = "Reply to all recipients"
"forward" = "Forward the message"
"compose" = "Write a new message"
"tab-prev" = "Switch to the previous tab"
"tab-next" = "Switch to the next tab"
"help" = "Show this help"
"scroll-down" = "Scroll down one line"
"scroll-up" = "Scroll up one line"
"scroll-top" = "Jump to the top"
"scroll-bottom" = "Jump to the bottom"
"back" = "Return to the message list"
"form-down" = "Move to the next form field"
"form-up" = "Move to the previous form field"
"edit" = "Edit the message body"
"attach" = "Attach a file"
"detach" = "Detach the attachment under the cursor"
"edit-from" = "Edit the From address"
"edit-to" = "Edit the To list"
"edit-subject" = "Edit the subject"
"account" = "Choose the sender account"
"signature" = "Choose the signature"
"send" = "Send the message"
"abort" = "Abort the composition"
"fuzzy-down" = "Move to the next candidate"
"fuzzy-up" = "Move to the previous candidate"
"fuzzy-select" = "Select the highlighted candidate"
"fuzzy-cancel" = "Cancel the picker"

