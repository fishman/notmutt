"p" = { fun = "pending", show = true }
"P" = { fun = "preview", desc = "Preview the message under the cursor", show = true }
"F" = { fun = "filter", desc = "Live-filter the index rows", show = true }
"g g" = { fun = "cursor-top", desc = "Jump to the first row" }
"G" = { fun = "cursor-bottom", desc = "Jump to the last row" }
"g r" = { fun = "reply-all", show = true }
"g i" = { fun = "goto-inbox", desc = "Show the inbox view", show = true }
"g u" = { fun = "goto-unread", desc = "Show the unread view", show = true }
"g a" = { fun = "goto-archive", desc = "Show the archive view", show = true }
"g p" = { fun = "goto-pending", desc = "Show the pending view", show = true }
"g s" = { fun = "goto-sent", desc = "Show the sent view", show = true }
"g S" = { fun = "goto-spam", desc = "Show the spam view", show = true }
"g d" = { fun = "goto-deleted", desc = "Show the deleted view", show = true }
"g D" = { fun = "goto-draft", desc = "Show the draft view", show = true }
"ctrl+d" = { fun = "half-page-down", desc = "Scroll down half a page" }
"ctrl+u" = { fun = "half-page-up", desc = "Scroll up half a page" }
"pgdown" = { fun = "page-down", desc = "Scroll down one page" }
"pgup" = { fun = "page-up", desc = "Scroll up one page" }
"[" = { fun = "tab-prev", desc = "Switch to the previous tab", show = true }
"]" = { fun = "tab-next", desc = "Switch to the next tab", show = true }
"?" = { fun = "help", desc = "Show this help", show = true }
"~" = { fun = "log", desc = "Show the session log", show = true }
"=" = { fun = "refresh", desc = "Check for new mail now", show = true }

